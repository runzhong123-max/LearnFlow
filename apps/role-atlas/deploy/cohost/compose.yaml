services:
  learnflow-backend:
    build:
      context: ${LEARNFLOW_REPO_PATH:-../../../..}
      dockerfile: deploy/backend.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    environment: &learning_backend_environment
      DATABASE_URL: sqlite+aiosqlite:////data/learnflow.db
      CORS_ORIGINS: https://${LEARNFLOW_HOST},https://${WORK_TASK_HOST:-w2ltask.learnflow.club}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?set shared cookie domain}
      AUTH_RUNTIME_BRIDGE_TOKEN: ${AUTH_RUNTIME_BRIDGE_TOKEN:?set runtime bridge token}
      AUTH_API_KEY_KEK: ${AUTH_API_KEY_KEK:?set auth key encryption key}
      ROLE_PACKAGE_LAUNCH_SECRET: ${ROLE_PACKAGE_LAUNCH_SECRET:?set package launch secret}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:?set registration invite code}
      DEFAULT_ACCOUNT_CREDIT_LIMIT: ${DEFAULT_ACCOUNT_CREDIT_LIMIT:--1}
      MEMORY_AUTO_SYNTHESIS_ENABLED: "true"
      MEMORY_WORKER_EMBEDDED: "false"
      ROLE_ATLAS_GATEWAY_BASE_URL: https://${ROLE_ATLAS_HOST}
      ROLE_ATLAS_GATEWAY_SECRET: ${ROLE_ATLAS_GATEWAY_SECRET:?set ecosystem gateway secret}
      SOURCE_CACHE_DIR: /data/repo-files
      SOURCE_UPLOADS_DIR: /data/source-uploads
      RUNTIME_DIR: /data/runtime
      LLM_API_KEY: ${LEARNFLOW_LLM_API_KEY:-}
      LLM_BASE_URL: ${LEARNFLOW_LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LEARNFLOW_LLM_MODEL:-gpt-4o-mini}
      VISION_API_KEY: ${LEARNFLOW_VISION_API_KEY:-}
      VISION_BASE_URL: ${LEARNFLOW_VISION_BASE_URL:-https://api.moonshot.cn/v1}
      VISION_MODEL: ${LEARNFLOW_VISION_MODEL:-moonshot-v1-8k-vision-preview}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - learnflow-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  learnflow-memory-worker:
    build:
      context: ${LEARNFLOW_REPO_PATH:-../../../..}
      dockerfile: deploy/backend.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *learning_backend_environment
      LEARNFLOW_WORKER_LOCK: /data/memory-worker.lock
    volumes:
      - learnflow-data:/data
    depends_on:
      learnflow-backend:
        condition: service_healthy

  learnflow-frontend:
    build:
      context: ${LEARNFLOW_REPO_PATH:-../../../..}
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      learnflow-backend:
        condition: service_healthy
    environment:
      LEARNFLOW_BACKEND_URL: http://learnflow-backend:8010
      LEARNFLOW_LLM_BASE_URL: ${LEARNFLOW_LLM_BASE_URL:?set LearnFlow model base URL}
      LEARNFLOW_LLM_MODEL: ${LEARNFLOW_LLM_MODEL:?set LearnFlow model name}
      LEARNFLOW_TUTOR_MAX_OUTPUT_TOKENS: ${LEARNFLOW_TUTOR_MAX_OUTPUT_TOKENS:-6000}
      LEARNFLOW_TUTOR_PLANNING_MAX_OUTPUT_TOKENS: ${LEARNFLOW_TUTOR_PLANNING_MAX_OUTPUT_TOKENS:-12000}
      LEARNFLOW_TUTOR_PLANNING_RECOVERY_MAX_OUTPUT_TOKENS: ${LEARNFLOW_TUTOR_PLANNING_RECOVERY_MAX_OUTPUT_TOKENS:-6000}
      LEARNFLOW_TUTOR_PLANNING_CONTEXT_MESSAGES: ${LEARNFLOW_TUTOR_PLANNING_CONTEXT_MESSAGES:-12}
      LEARNFLOW_TUTOR_PLANNING_CONTEXT_ENVELOPE_CHARS: ${LEARNFLOW_TUTOR_PLANNING_CONTEXT_ENVELOPE_CHARS:-12000}
      LEARNFLOW_TUTOR_PLANNING_CONTEXT_OBSERVATION_CHARS: ${LEARNFLOW_TUTOR_PLANNING_CONTEXT_OBSERVATION_CHARS:-2400}
      LEARNFLOW_TUTOR_PLANNING_CONTEXT_OBSERVATION_TOTAL_CHARS: ${LEARNFLOW_TUTOR_PLANNING_CONTEXT_OBSERVATION_TOTAL_CHARS:-8000}
      LEARNFLOW_TUTOR_PLANNING_TOOL_DESCRIPTION_CHARS: ${LEARNFLOW_TUTOR_PLANNING_TOOL_DESCRIPTION_CHARS:-360}
      LEARNING_TASK_PREFLIGHT_API_KEY: ${LEARNFLOW_LLM_API_KEY:?set LearnFlow model API key}
      LEARNING_TASK_PREFLIGHT_BASE_URL: ${LEARNFLOW_LLM_BASE_URL:?set LearnFlow model base URL}
      LEARNING_TASK_PREFLIGHT_MODEL: ${LEARNFLOW_LLM_MODEL:?set LearnFlow model name}
      LEARNFLOW_PUBLIC_ORIGIN: https://${LEARNFLOW_HOST}
      AUTH_RUNTIME_BRIDGE_TOKEN: ${AUTH_RUNTIME_BRIDGE_TOKEN:?set runtime bridge token}
      LEARNFLOW_GRAPH_HUB_CATALOG: /shared/graph-hub/catalogs/public.json
      LEARNFLOW_GRAPH_HUB_CATALOG_ROOT: /shared/graph-hub
      LEARNFLOW_ROLE_AGENT_PACKAGE_ROOTS: /shared/role-packages
      LEARNFLOW_GRAPH_HUB_BASE_URL: https://${GRAPH_HUB_HOST}
      LEARNFLOW_ROLE_AGENT_BASE_URL: https://${ROLE_ATLAS_HOST}
      JINA_API_KEY: ${JINA_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - ../../packages:/shared/role-packages:ro
      - ../../output/graph-hub:/shared/graph-hub:ro

  role-atlas:
    build:
      context: ${LEARNFLOW_REPO_PATH:-../../../..}
      dockerfile: apps/role-atlas/Dockerfile
      args:
        NODE_BUILD_MEMORY_MB: ${ROLE_ATLAS_BUILD_MEMORY_MB:-1280}
    command: sh -c 'rm -f /app/apps/role-atlas/.vinext/dev/lock.json && exec npm run dev -- --hostname 0.0.0.0 --port 3000'
    restart: unless-stopped
    environment:
      LEARNFLOW_BASE_URL: http://learnflow-backend:8010
      LEARNFLOW_PUBLIC_URL: https://${LEARNFLOW_HOST}
      ROLE_ATLAS_PUBLIC_URL: https://${ROLE_ATLAS_HOST}
      GRAPH_HUB_PUBLIC_URL: https://${GRAPH_HUB_HOST}
      WORK_TASK_PUBLIC_URL: https://${WORK_TASK_HOST:-w2ltask.learnflow.club}
      ROLE_PACKAGE_LAUNCH_SECRET: ${ROLE_PACKAGE_LAUNCH_SECRET:?set package launch secret}
      ROLE_ATLAS_GATEWAY_SECRET: ${ROLE_ATLAS_GATEWAY_SECRET:?set ecosystem gateway secret}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ROLE_ATLAS_SEARCH_ENGINE: ${ROLE_ATLAS_SEARCH_ENGINE:-search_pro}
      ROLE_ATLAS_MODEL_PROVIDER: ${ROLE_ATLAS_MODEL_PROVIDER:-deepseek}
      ROLE_ATLAS_MODEL: ${ROLE_ATLAS_MODEL:-deepseek-v4-flash}
      ROLE_ATLAS_MODEL_BASE_URL: http://caddy:8081
      ROLE_ATLAS_SEARCH_PROVIDER: ${ROLE_ATLAS_SEARCH_PROVIDER:-glm}
    volumes:
      - role-atlas-state:/app/apps/role-atlas/.wrangler
      - ../../output/graph-hub:/app/apps/role-atlas/output/graph-hub

  role-atlas-job-worker:
    image: node:22-bookworm-slim
    restart: unless-stopped
    command: node /worker/job-worker.mjs
    environment:
      ROLE_ATLAS_INTERNAL_URL: http://role-atlas:3000
      ROLE_ATLAS_GATEWAY_SECRET: ${ROLE_ATLAS_GATEWAY_SECRET:?set ecosystem gateway secret}
    volumes:
      - ../../scripts/job-worker.mjs:/worker/job-worker.mjs:ro
    depends_on:
      - role-atlas
    stop_grace_period: 30s

  role-atlas-launch-proxy:
    image: node:22-bookworm-slim
    restart: unless-stopped
    command: node /proxy/launch-proxy.mjs
    environment:
      PORT: "3010"
      ROLE_ATLAS_INTERNAL_URL: http://role-atlas:3000
      LEARNFLOW_INTERNAL_URL: http://learnflow-backend:8010
      LEARNFLOW_PUBLIC_URL: https://${LEARNFLOW_HOST}
      ROLE_ATLAS_PUBLIC_URL: https://${ROLE_ATLAS_HOST}
      GRAPH_HUB_PUBLIC_URL: https://${GRAPH_HUB_HOST}
      WORK_TASK_PUBLIC_URL: https://${WORK_TASK_HOST:-w2ltask.learnflow.club}
      ROLE_PACKAGE_LAUNCH_SECRET: ${ROLE_PACKAGE_LAUNCH_SECRET:?set package launch secret}
    volumes:
      - ./launch-proxy.mjs:/proxy/launch-proxy.mjs:ro
      - ./task-launch-core.mjs:/proxy/task-launch-core.mjs:ro
    depends_on:
      - role-atlas
      - learnflow-backend

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - learnflow-frontend
      - role-atlas
      - role-atlas-launch-proxy
    environment:
      LEARNFLOW_HOST: ${LEARNFLOW_HOST}
      ROLE_ATLAS_HOST: ${ROLE_ATLAS_HOST}
      GRAPH_HUB_HOST: ${GRAPH_HUB_HOST}
      WORK_TASK_HOST: ${WORK_TASK_HOST:-w2ltask.learnflow.club}
      ROOT_HOST: ${ROOT_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  learnflow-data:
  role-atlas-state:
  caddy-data:
  caddy-config:
