<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f7ff"/>
    </linearGradient>
    <linearGradient id="blueBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3a8f"/>
      <stop offset="1" stop-color="#125cc5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dbe7f8" stroke-width="1" opacity="0.36"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#163b6d" flood-opacity="0.11"/>
    </filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#1757b8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#0f7d82"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#dc7a16"/>
    </marker>
    <style>
      text { font-family: sans-serif; }
      .title { font-size: 42px; font-weight: 760; fill: #092b6c; letter-spacing: 1px; }
      .subtitle { font-size: 20px; font-weight: 600; fill: #2353a1; }
      .h2 { font-size: 23px; font-weight: 750; fill: #10356f; }
      .h3 { font-size: 18px; font-weight: 720; }
      .body { font-size: 14px; fill: #314966; }
      .small { font-size: 12px; fill: #52677f; }
      .mono { font-family: monospace; font-size: 12px; fill: #254364; }
      .pill { font-size: 12px; font-weight: 650; }
      .chain { font-size: 16px; font-weight: 720; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <rect width="1600" height="1120" fill="url(#grid)"/>

  <text x="70" y="68" class="title">LearnFlow 五核记忆织网 v2</text>
  <text x="72" y="102" class="subtitle">证据唯一权威 × 有界短期热头部 × 类型化长期记忆 × 能力级上下文装配</text>
  <g transform="translate(1170,45)">
    <rect width="360" height="66" rx="14" fill="#ffffff" stroke="#b9ccef"/>
    <line x1="22" y1="22" x2="70" y2="22" stroke="#1757b8" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="82" y="27" class="small">只读上下文流</text>
    <line x1="22" y1="46" x2="70" y2="46" stroke="#dc7a16" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <text x="82" y="51" class="small">证据写入流</text>
    <line x1="205" y1="22" x2="253" y2="22" stroke="#0f7d82" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowTeal)"/>
    <text x="265" y="27" class="small">可重建投影</text>
  </g>

  <!-- Consumers -->
  <g filter="url(#shadow)">
    <rect x="70" y="142" width="1460" height="118" rx="20" fill="#ffffff" stroke="#a9c1ea" stroke-width="1.5"/>
  </g>
  <text x="96" y="174" class="h2">消费层 · 三类主 Agent 与工作台</text>
  <g>
    <rect x="98" y="190" width="320" height="48" rx="12" fill="#edf4ff" stroke="#7aa5e8"/>
    <text x="258" y="212" text-anchor="middle" class="h3" fill="#174d9e">Tutor 控制 Agent</text>
    <text x="258" y="230" text-anchor="middle" class="small">Global / Project / Checkpoint</text>

    <rect x="440" y="190" width="320" height="48" rx="12" fill="#ebfaf5" stroke="#77c7ad"/>
    <text x="600" y="212" text-anchor="middle" class="h3" fill="#126b58">Learning Design Agent</text>
    <text x="600" y="230" text-anchor="middle" class="small">路线、讲义、评估规格</text>

    <rect x="782" y="190" width="320" height="48" rx="12" fill="#f5efff" stroke="#aa8ee8"/>
    <text x="942" y="212" text-anchor="middle" class="h3" fill="#6241a8">Practice Agent</text>
    <text x="942" y="230" text-anchor="middle" class="small">判题、纠错、迁移验证</text>

    <rect x="1124" y="190" width="378" height="48" rx="12" fill="#fff7e8" stroke="#e8b260"/>
    <text x="1313" y="212" text-anchor="middle" class="h3" fill="#9a5b0d">Workbench / Skill / Tool</text>
    <text x="1313" y="230" text-anchor="middle" class="small">复习台、关卡、画像、桌面工作区</text>
  </g>

  <!-- Context packet -->
  <path d="M800 260V286" stroke="#1757b8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <rect x="170" y="288" width="1260" height="118" rx="20" fill="#f7faff" stroke="#4f83d5" stroke-width="1.8"/>
  </g>
  <text x="205" y="323" class="h2">FiveKernelContextPacket</text>
  <text x="495" y="323" class="body">一次回合的只读快照 · 不等于事实 · 不参与掌握归约</text>
  <g>
    <rect x="204" y="342" width="178" height="40" rx="10" fill="#ffffff" stroke="#a9c1ea"/>
    <text x="293" y="367" text-anchor="middle" class="pill" fill="#254e8a">kernel_heads</text>
    <rect x="395" y="342" width="150" height="40" rx="10" fill="#ffffff" stroke="#a9c1ea"/>
    <text x="470" y="367" text-anchor="middle" class="pill" fill="#254e8a">items ≤ 12</text>
    <rect x="558" y="342" width="176" height="40" rx="10" fill="#ffffff" stroke="#a9c1ea"/>
    <text x="646" y="367" text-anchor="middle" class="pill" fill="#254e8a">relation_paths ≤ 6</text>
    <rect x="747" y="342" width="154" height="40" rx="10" fill="#ffffff" stroke="#a9c1ea"/>
    <text x="824" y="367" text-anchor="middle" class="pill" fill="#254e8a">conflicts</text>
    <rect x="914" y="342" width="166" height="40" rx="10" fill="#ffffff" stroke="#a9c1ea"/>
    <text x="997" y="367" text-anchor="middle" class="pill" fill="#254e8a">missing / omitted</text>
    <rect x="1093" y="342" width="300" height="40" rx="10" fill="#eaf8f6" stroke="#62b9b1"/>
    <text x="1243" y="359" text-anchor="middle" class="pill" fill="#0a686d">manifest · evidence_ids · token budget</text>
    <text x="1243" y="375" text-anchor="middle" class="small">answer-free · deterministic snapshot_id</text>
  </g>

  <!-- Policy + Retriever -->
  <path d="M800 406V432" stroke="#1757b8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <rect x="120" y="434" width="1360" height="138" rx="20" fill="#ffffff" stroke="#4d8b9f" stroke-width="1.7"/>
  </g>
  <rect x="146" y="456" width="340" height="92" rx="14" fill="#eef7ff" stroke="#6da0dc"/>
  <text x="316" y="482" text-anchor="middle" class="h3" fill="#174d9e">ContextPolicy</text>
  <text x="316" y="507" text-anchor="middle" class="body">capability / workbench 固定映射</text>
  <text x="316" y="530" text-anchor="middle" class="small">global · project · checkpoint · review</text>

  <path d="M486 502H542" stroke="#1757b8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="544" y="456" width="736" height="92" rx="14" fill="#f0fbfa" stroke="#52aaa7"/>
  <text x="912" y="482" text-anchor="middle" class="h3" fill="#096d72">FiveKernelRetriever · 无 LLM 热路径</text>
  <g class="body">
    <text x="580" y="510">1  learner ownership + project / checkpoint / session 精确过滤</text>
    <text x="580" y="534">2  subject exact → lexical + salience → allow-listed one-hop relation</text>
  </g>
  <rect x="1302" y="456" width="148" height="92" rx="14" fill="#fff8ec" stroke="#dfa752"/>
  <text x="1376" y="483" text-anchor="middle" class="h3" fill="#995a10">安全闸</text>
  <text x="1376" y="508" text-anchor="middle" class="small">scope 二次过滤</text>
  <text x="1376" y="528" text-anchor="middle" class="small">答案字段脱敏</text>

  <!-- Heads -->
  <path d="M800 572V601" stroke="#0f7d82" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowTeal)"/>
  <text x="112" y="621" class="h2">短期热投影 · KernelHead</text>
  <text x="1370" y="621" text-anchor="end" class="small">每核：focus 3 · alerts 5 · working 8 · stable 5</text>
  <g filter="url(#shadow)">
    <rect x="90" y="638" width="272" height="142" rx="18" fill="#eef4ff" stroke="#5a8bd8" stroke-width="1.5"/>
    <rect x="378" y="638" width="272" height="142" rx="18" fill="#edfaf6" stroke="#54ae8e" stroke-width="1.5"/>
    <rect x="666" y="638" width="272" height="142" rx="18" fill="#fff5f5" stroke="#d7777f" stroke-width="1.5"/>
    <rect x="954" y="638" width="272" height="142" rx="18" fill="#fff8e9" stroke="#d6a247" stroke-width="1.5"/>
    <rect x="1242" y="638" width="272" height="142" rx="18" fill="#f5f0ff" stroke="#8d6cd1" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <text x="226" y="674" class="h3" fill="#245caa">Structure</text>
    <text x="226" y="699" class="body">位置 · 依赖 · 转向 · 返回</text>
    <text x="226" y="726" class="mono">anchor / blocker / resume</text>
    <text x="226" y="754" class="small">决定：走哪儿</text>

    <text x="514" y="674" class="h3" fill="#16745c">Knowledge</text>
    <text x="514" y="699" class="body">理解 · 缺口 · 误解 · 保持</text>
    <text x="514" y="726" class="mono">gap / misconception / retention</text>
    <text x="514" y="754" class="small">决定：学什么</text>

    <text x="802" y="674" class="h3" fill="#a3444f">Human</text>
    <text x="802" y="699" class="body">负荷 · 注意 · 偏好 · 支持</text>
    <text x="802" y="726" class="mono">affect / load / preference</text>
    <text x="802" y="754" class="small">决定：怎么教</text>

    <text x="1090" y="674" class="h3" fill="#9a660e">Value</text>
    <text x="1090" y="699" class="body">目标 · 优先级 · 动机 · 相关性</text>
    <text x="1090" y="726" class="mono">goal / priority / relevance</text>
    <text x="1090" y="754" class="small">决定：为什么现在学</text>

    <text x="1378" y="674" class="h3" fill="#6849aa">Practice</text>
    <text x="1378" y="699" class="body">尝试 · 辅助 · 反馈 · 迁移</text>
    <text x="1378" y="726" class="mono">attempt / remediation / transfer</text>
    <text x="1378" y="754" class="small">决定：怎样验证</text>
  </g>

  <!-- Long-term fabric -->
  <path d="M800 780V811" stroke="#0f7d82" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowTeal)"/>
  <g filter="url(#shadow)">
    <rect x="90" y="814" width="1120" height="170" rx="20" fill="#ffffff" stroke="#557db7" stroke-width="1.7"/>
  </g>
  <text x="120" y="848" class="h2">长期可检查记忆 · Typed Memory Fabric</text>
  <text x="1180" y="846" text-anchor="end" class="small">subject + scope + salience + provenance + schema_version</text>
  <g>
    <rect x="130" y="872" width="278" height="78" rx="14" fill="#edf4ff" stroke="#6e9cdd"/>
    <text x="269" y="901" text-anchor="middle" class="h3" fill="#174d9e">MemoryFact</text>
    <text x="269" y="925" text-anchor="middle" class="body">不可变原子事实 · 直接回到事件</text>

    <path d="M408 911H478" stroke="#1757b8" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <rect x="480" y="872" width="278" height="78" rx="14" fill="#eefaf5" stroke="#64ae93"/>
    <text x="619" y="901" text-anchor="middle" class="h3" fill="#126b58">MemoryModule</text>
    <text x="619" y="925" text-anchor="middle" class="body">同核同主题综合 · 不可变</text>

    <path d="M758 911H828" stroke="#1757b8" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <rect x="830" y="872" width="330" height="78" rx="14" fill="#f5efff" stroke="#9a7bd8"/>
    <text x="995" y="901" text-anchor="middle" class="h3" fill="#6241a8">MemoryClaim</text>
    <text x="995" y="925" text-anchor="middle" class="body">可证伪长期声明 · 支持/冲突/替代</text>
  </g>
  <text x="130" y="971" class="small">Sparse MemoryEdge：SUPPORTS · CONTRADICTS · REFINES · SUPERSEDES · BLOCKS · ENABLES · SAME_SUBJECT</text>

  <!-- Separate stores -->
  <g filter="url(#shadow)">
    <rect x="1235" y="814" width="279" height="170" rx="20" fill="#fbfcff" stroke="#99add0"/>
  </g>
  <text x="1374" y="847" text-anchor="middle" class="h3" fill="#385982">三类数据分开治理</text>
  <rect x="1260" y="865" width="229" height="30" rx="8" fill="#edf4ff"/>
  <text x="1374" y="885" text-anchor="middle" class="small">领域 RAG：课程与来源知识</text>
  <rect x="1260" y="905" width="229" height="30" rx="8" fill="#eefaf5"/>
  <text x="1374" y="925" text-anchor="middle" class="small">学习者记忆：五核证据</text>
  <rect x="1260" y="945" width="229" height="30" rx="8" fill="#fff7e8"/>
  <text x="1374" y="965" text-anchor="middle" class="small">运行数据：题目/Attempt/Review</text>

  <!-- Authority chain -->
  <path d="M650 1008V986" stroke="#dc7a16" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <rect x="70" y="1010" width="1460" height="74" rx="16" fill="url(#blueBand)"/>
  <text x="105" y="1038" class="h3" fill="#ffffff">唯一权威写入链</text>
  <text x="105" y="1065" class="body" fill="#dceaff">用户 / UI / Tool / Agent 行为</text>
  <text x="430" y="1043" class="chain">→ EvidenceEvent → five_kernel_reducer → KernelMutation → KernelState</text>
  <text x="650" y="1067" class="chain">→ MemoryFact → MemoryModule → MemoryClaim</text>
  <rect x="1250" y="1028" width="246" height="39" rx="10" fill="#ffffff" opacity="0.14"/>
  <text x="1373" y="1052" text-anchor="middle" class="pill" fill="#ffffff">Reducer only · scope · idempotency</text>

  <text x="800" y="1105" text-anchor="middle" class="small">KernelHead / ContextPacket 可随时重建；调度、生成内容与模型判断都不能直接升级掌握。</text>
</svg>
