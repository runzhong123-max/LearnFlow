<script>/* Pure teaching models. No DOM, network, generated scripts, or learner state. */
globalThis.buildHubModel=(id,p)=>{
 const frames=[],f=(note,view={})=>frames.push({note,...JSON.parse(JSON.stringify(view))}),sum=a=>a.reduce((s,x)=>s+x,0),range=n=>Array.from({length:n},(_,i)=>i),soft=a=>{let m=Math.max(...a),e=a.map(x=>Math.exp(x-m));return e.map(x=>x/sum(e))},fmt=x=>Number(x.toFixed(4));
 const curve=(fn,a,b,n=60)=>range(n+1).map(i=>[a+(b-a)*i/n,fn(a+(b-a)*i/n)]);
 const bars=(a,labels)=>({bars:a,labels:labels||a.map((_,i)=>String(i))});
 const points=(pts,extra={})=>({points:pts,...extra});
 const es=[[0,1,4],[0,2,2],[1,2,1],[1,3,5],[2,3,p],[2,4,10],[3,4,2],[3,5,6],[4,5,3]],graph=(active=[],edges=es)=>({graph:{nodes:range(6).map(i=>({id:i,label:'ABCDEF'[i]})),edges:edges.map(([a,b,w])=>({a,b,label:String(w)})),active}});
 const arr=[p,3,12,5,8,1,10];
 if(id==='riemann'){let total=0;for(let i=0;i<p;i++){total+=(i/p)**2/p;f(`加入第 ${i+1} 个左端点矩形；面积和 ${fmt(total)}，精确面积 1/3`,{...bars(range(p).map(j=>j<=i?(j/p)**2:0)),metric:total,formula:'Σ (i/n)² · 1/n'})}}
 else if(id==='chain'){let u=2*p+1;f(`内层 u=2x+1=${fmt(u)}，du/dx=2`,{chain:['x='+p,'u='+fmt(u),'y='+fmt(u*u)],active:1});f(`外层 dy/du=2u=${fmt(2*u)}，相乘 dy/dx=${fmt(4*u)}`,{chain:['x='+p,'×2','u='+fmt(u),'×'+fmt(2*u),'y='+fmt(u*u)],metric:4*u})}
 else if(id==='projection'||id==='eigen'){let t=p*Math.PI/180,x=Math.cos(t),y=Math.sin(t);if(id==='projection'){let d=3*x+2*y;f(`投影长度 v·u=${fmt(d)}；残差与方向正交`,points([[3,2],[d*x,d*y]],{segments:[[0,0,3,2],[0,0,d*x,d*y],[3,2,d*x,d*y]],metric:d,residual:[3-d*x,2-d*y]}))}else f(`v=(${fmt(x)},${fmt(y)}) → Av=(${fmt(2*x)},${fmt(y)})；只有坐标轴方向不变`,points([[x,y],[2*x,y]],{segments:[[0,0,x,y],[0,0,2*x,y]],metric:Math.abs(x*y)}))}
 else if(id==='svd'){let a=[5,3,1].map((s,i)=>i<p?s:0);f(`保留前 ${p} 个奇异值，误差 √Σ未保留σ²=${fmt(Math.sqrt(sum([5,3,1].slice(p).map(x=>x*x))))}`,{matrix:[[a[0],0,0],[0,a[1],0],[0,0,a[2]]],metric:Math.sqrt(sum([5,3,1].slice(p).map(x=>x*x))),formula:'A = diag(5,3,1)，σ₁ ≥ σ₂ ≥ σ₃'})}
 else if(id==='binomial'){let q=p/100,a=range(11).map(k=>{let c=1;for(let i=1;i<=k;i++)c=c*(11-i)/i;return c*q**k*(1-q)**(10-k)});f(`十次独立试验，期望成功 ${fmt(10*q)} 次；总概率 ${fmt(sum(a))}`,{...bars(a),metric:sum(a)})}
 else if(id==='normal')f(`σ=${p}；峰值 ${fmt(1/(p*Math.sqrt(2*Math.PI)))}。横轴为数值，纵轴为概率密度`,{plot:curve(x=>Math.exp(-x*x/(2*p*p))/(p*Math.sqrt(2*Math.PI)),-6,6),metric:1/(p*Math.sqrt(2*Math.PI))});
 else if(id==='clt'){let a=[1];for(let n=1;n<=p;n++){let b=Array(a.length+6).fill(0);a.forEach((v,i)=>{for(let j=1;j<=6;j++)b[i+j]+=v/6});a=b;f(`${n} 个公平骰子的点数和，期望 ${3.5*n}；分布逐渐呈钟形；这里显示未标准化点数和`,{...bars(a),metric:sum(a)})}}
 else if(id==='entropy'){let q=p/100,h=-q*Math.log2(q)-(1-q)*Math.log2(1-q);f(`H=${fmt(h)} bit；p=0.5 时最大为 1 bit`,{plot:curve(x=>-x*Math.log2(x)-(1-x)*Math.log2(1-x),.001,.999),points:[[q,h]],metric:h})}
 else if(id==='descent'){let x=3,history=[];for(let n=0;n<=12;n++){history.push([n,x]);f(`第 ${n} 步 x=${fmt(x)}，损失 x²=${fmt(x*x)}；x ← (1−2α)x`,{plot:history,metric:x});x*=1-2*p}}
 else if(['quicksort','merge','heap'].includes(id)){
  const a=arr.slice(),snap=(note,active=[])=>f(note,{...bars(a),active});snap('初始数组');
  if(id==='quicksort'){const sort=(lo,hi)=>{if(lo>=hi)return;let pivot=a[hi],i=lo;for(let j=lo;j<hi;j++){snap(`比较 ${a[j]} 与枢轴 ${pivot}`,[j,hi]);if(a[j]<=pivot){[a[i],a[j]]=[a[j],a[i]];snap('小元素移入左区间',[i,j]);i++}}[a[i],a[hi]]=[a[hi],a[i]];snap(`枢轴归位到 ${i}`,[i]);sort(lo,i-1);sort(i+1,hi)};sort(0,a.length-1)}
  if(id==='merge'){for(let w=1;w<a.length;w*=2)for(let l=0;l<a.length;l+=2*w){let x=a.slice(l,l+w),y=a.slice(l+w,l+2*w),out=[];while(x.length||y.length)out.push(!y.length||x.length&&x[0]<=y[0]?x.shift():y.shift());a.splice(l,out.length,...out);snap(`合并长度至多 ${w} 的两个有序段`,range(out.length).map(i=>l+i))}}
  if(id==='heap'){const down=(i,n)=>{while(true){let m=i,l=i*2+1,r=l+1;if(l<n&&a[l]>a[m])m=l;if(r<n&&a[r]>a[m])m=r;if(m===i)break;[a[m],a[i]]=[a[i],a[m]];snap('较大子节点上移',[i,m]);i=m}};for(let i=Math.floor(a.length/2)-1;i>=0;i--)down(i,a.length);for(let n=a.length-1;n>0;n--){[a[0],a[n]]=[a[n],a[0]];snap('最大值进入有序后缀',[n]);down(0,n)}}snap('排序完成');
 }
 else if(id==='binary'){let a=[1,3,5,7,9,11,13,15],l=0,r=7,found=-1;while(l<=r){let m=(l+r)>>1;f(`区间 [${l},${r}]，中点 ${m} 的值为 ${a[m]}`,{...bars(a),active:[m],range:[l,r]});if(a[m]===p){found=m;break}if(a[m]<p)l=m+1;else r=m-1}f(found<0?'区间为空，目标不存在':`找到目标，下标 ${found}`,{...bars(a),active:found<0?[]:[found],metric:found})}
 else if(id==='huffman'){
  let serial=0,forest=[p,9,12,13,16,20].map((w,i)=>({id:serial++,w,label:'ABCDEF'[i]}));const all=forest.slice(),edges=[];
  const snap=note=>f(note,{graph:{nodes:all.map(n=>({id:n.id,label:n.label+':'+n.w})),edges:edges.slice()},labels:forest.map(n=>String(n.w))});snap('每个符号是一棵叶子树');
  while(forest.length>1){forest.sort((a,b)=>a.w-b.w||a.id-b.id);let a=forest.shift(),b=forest.shift(),n={id:serial++,w:a.w+b.w,label:'Σ'};all.push(n);edges.push({a:n.id,b:a.id,label:'0'},{a:n.id,b:b.id,label:'1'});forest.push(n);snap(`合并最小权重 ${a.w} 与 ${b.w} → ${n.w}`)}
  const depth=(id,d)=>edges.filter(e=>e.a===id).length?sum(edges.filter(e=>e.a===id).map(e=>depth(e.b,d+1))):all[id].w*d;frames.at(-1).metric=depth(forest[0].id,0);frames.at(-1).note+='；加权路径长度 '+frames.at(-1).metric;
 }
 else if(id==='bfs'||id==='dfs'){let todo=[p],seen=new Set(),order=[];while(todo.length){let u=id==='bfs'?todo.shift():todo.pop();if(seen.has(u))continue;seen.add(u);order.push(u);const next=es.flatMap(([a,b])=>a===u?[b]:b===u?[a]:[]).filter(v=>!seen.has(v));todo.push(...(id==='dfs'?next.reverse():next));f(`访问 ${'ABCDEF'[u]}；${id==='bfs'?'队列':'栈'}：${todo.map(i=>'ABCDEF'[i]).join(' ')||'空'}`,{...graph([...seen],es.map(([a,b])=>[a,b,''])),metric:order.slice()})}}
 else if(id==='prim'||id==='kruskal'){let chosen=[],cost=0,seen=new Set([0]),parent=range(6),find=x=>parent[x]===x?x:find(parent[x]);const list=es.slice().sort((a,b)=>a[2]-b[2]);while(chosen.length<5){let e=id==='prim'?list.find(([a,b])=>seen.has(a)!==seen.has(b)):list.shift();if(!e)break;let[a,b,w]=e;if(id==='kruskal'&&find(a)===find(b)){f(`跳过 ${'ABCDEF'[a]}—${'ABCDEF'[b]}：会形成环`,graph([...seen],chosen));continue}chosen.push(e);cost+=w;seen.add(a);seen.add(b);parent[find(a)]=find(b);f(`选择 ${'ABCDEF'[a]}—${'ABCDEF'[b]}，累计权重 ${cost}`,{...graph([...seen],chosen),metric:cost})}}
 else if(id==='knapsack'){let ws=[2,3,4,5],vs=[3,4,5,8],d=Array(p+1).fill(0);f('容量 0 到 '+p+'，尚未选择物品',bars(d));ws.forEach((w,i)=>{for(let c=p;c>=w;c--)d[c]=Math.max(d[c],d[c-w]+vs[i]);f(`处理重量 ${w}、价值 ${vs[i]}；倒序更新保证每件最多一次`,{...bars(d),metric:d[p]})})}
 else if(['cache','lru','fifo'].includes(id)){let seq=id==='cache'?[0,1,4,0,5,1,4,0]:[1,2,3,4,1,2,5,1,2,3,4,5],slots=Array(p).fill(null),age=[],miss=0;seq.forEach((x,i)=>{let hit=slots.includes(x),pos=slots.indexOf(x);if(id==='cache'){pos=x%p;hit=slots[pos]===x;if(!hit)slots[pos]=x}else if(!hit){pos=slots.indexOf(null);if(pos<0){const victim=age.shift();pos=slots.indexOf(victim)}slots[pos]=x;age.push(x)}if(id==='lru'&&hit){age=age.filter(y=>y!==x);age.push(x)}if(!hit)miss++;f(`访问 ${x}：${hit?'命中':'缺失'}；累计缺失 ${miss}`,{cells:slots.map(v=>v===null?'空':v),active:[pos],metric:miss,formula:id==='cache'?'缓存行 = 块号 mod 行数':'访问前缀：'+seq.slice(0,i+1).join(' → ')})})}
 else if(id==='paging'){let table=[3,7,1,6,0,4,2,5],page=Math.floor(p/16),off=p%16;f(`虚拟地址 ${p} = 页号 ${page} × 16 + 偏移 ${off}`,{cells:table.map((v,i)=>i+'→'+v),active:[page]});f(`物理地址 = 帧号 ${table[page]} × 16 + ${off} = ${table[page]*16+off}`,{chain:['VA '+p,'页 '+page,'帧 '+table[page],'PA '+(table[page]*16+off)],metric:table[page]*16+off})}
 else if(id==='roundrobin'){let left=[5,3,7],t=0,segments=[],completion=[0,0,0];while(left.some(x=>x>0))left.forEach((v,i)=>{if(v>0){let dt=Math.min(p,v);segments.push({label:'P'+i,start:t,end:t+dt});t+=dt;left[i]-=dt;if(left[i]===0)completion[i]=t;f(`P${i} 执行 ${dt} 单位；剩余 ${left.join(', ')}`,{timeline:segments,metric:t})}});frames.at(-1).note+='；周转时间 '+completion.join(', ')+'，等待时间 '+completion.map((v,i)=>v-[5,3,7][i]).join(', ')}
 else if(id==='deadlock'){let edges=range(p).map(i=>({a:i,b:(i+1)%3,label:'等待',directed:true}));f(p===3?'形成 P0→P1→P2→P0 环；在本例互斥且不可抢占的条件下死锁':'等待图无环，本例尚未死锁',{graph:{nodes:range(3).map(i=>({id:i,label:'P'+i})),edges},metric:p===3})}
 else if(id==='subnet'){let size=2**(32-p),net=Math.floor(130/size)*size;f(`地址 192.168.1.130/${p}：末字节前 ${p-24} 位属于网络`,{cells:(130).toString(2).padStart(8,'0').split(''),active:range(p-24),metric:net,formula:`网络 192.168.1.${net} · 广播 192.168.1.${net+size-1} · 常规可用主机 ${size-2}`})}
 else if(id==='window'){for(let ack=0;ack<=10;ack++)f(`已确认 ${ack} 个分组，最多再保持 ${Math.min(p,10-ack)} 个在途`,{cells:range(10).map(i=>i<ack?'已确认':i<ack+p?'在途':'等待'),active:range(Math.min(p,10-ack)).map(i=>ack+i),metric:Math.min(p,10-ack)})}
 else if(id==='aimd'){let w=1,history=[];for(let n=0;n<20;n++){history.push([n,w]);f(`轮次 ${n}：窗口 ${w}；${w>=p?'遇到阈值，下一轮减半':'下一轮加一'}`,{plot:history,metric:w});w=w>=p?Math.max(1,Math.floor(w/2)):w+1}}
 else if(id==='bloom'){let bits=Array(p).fill(0),keys=[3,7,11],h=x=>[x%p,(x*3+1)%p];for(const x of keys){h(x).forEach(i=>bits[i]=1);f(`插入 ${x}，置位 ${h(x).join('、')}`,{cells:bits,active:h(x)})}let falsePos=range(20).filter(x=>!keys.includes(x)&&h(x).every(i=>bits[i]));f(`查询 0..19，未插入但误报的键：${falsePos.join('、')||'无'}；查询阳性只表示可能存在`,{cells:bits,metric:falsePos.length})}
 else if(id==='perceptron'){let pts=[[-2,-1],[-1,2],[1,1],[2,-2],[2,2]];f(`分类条件 x+y+${p}≥0；点标签由当前边界重算`,points(pts,{classes:pts.map(([x,y])=>x+y+p>=0?1:0),segments:[[-3,3-p,3,-3-p]],metric:pts.filter(([x,y])=>x+y+p>=0).length}))}
 else if(id==='logistic')f(`σ(${p}x)=1/(1+e^(−${p}x))；中心导数 ${fmt(p/4)}`,{plot:curve(x=>1/(1+Math.exp(-p*x)),-6,6),metric:p/4});
 else if(id==='softmax'){let a=soft([1,2,3].map(x=>x/p));f(`温度 ${p}；概率和 ${fmt(sum(a))}。低温更集中，高温更平缓`,{...bars(a,['类0','类1','类2']),metric:sum(a)})}
 else if(id==='crossentropy'){let q=p/100;f(`正确类概率 ${q}，损失 −ln(p)=${fmt(-Math.log(q))}`,{plot:curve(x=>-Math.log(x),.01,.99),points:[[q,-Math.log(q)]],metric:-Math.log(q)})}
 else if(id==='backprop'){let y=2*p+1,e=y-5;f(`前向 y=${fmt(y)}，误差 y−t=${fmt(e)}，L=${fmt(e*e/2)}`,{chain:['x=2','w='+p,'y='+fmt(y),'L='+fmt(e*e/2)]});f(`反向 dL/dy=${fmt(e)}，dy/dw=2，所以 dL/dw=${fmt(e*2)}`,{chain:['L','×'+fmt(e),'y','×2','w'],metric:e*2})}
 else if(id==='conv'||id==='pool'){let a=[[1,2,0,1],[0,p,3,2],[1,0,2,1],[2,1,0,3]],out=Array.from({length:id==='conv'?3:2},()=>Array(id==='conv'?3:2).fill(null)),step=id==='conv'?1:2;for(let r=0;r<3;r+=step)for(let c=0;c<3;c+=step){let vals=[a[r][c],a[r][c+1],a[r+1][c],a[r+1][c+1]],v=id==='conv'?vals[0]-vals[3]:Math.max(...vals);out[r/step][c/step]=v;f(`${id==='conv'?'核 [[1,0],[0,−1]]，对应相乘求和':'取当前 2×2 区域最大值'} → ${v}`,{matrix:a,active:[r*4+c,r*4+c+1,(r+1)*4+c,(r+1)*4+c+1],output:out,metric:out})}}
 else if(id==='kmeans'){let pts=[[-2,-1],[-1,-2],[-2,-2],[1+p,1],[2+p,2],[1+p,2]],centers=[[-2,0],[2,0]];for(let n=0;n<5;n++){let cls=pts.map(v=>centers.map(c=>(v[0]-c[0])**2+(v[1]-c[1])**2)).map(d=>d[0]<=d[1]?0:1);centers=centers.map((c,k)=>{let g=pts.filter((_,i)=>cls[i]===k);return g.length?[sum(g.map(x=>x[0]))/g.length,sum(g.map(x=>x[1]))/g.length]:c});f(`第 ${n+1} 次分配后更新重心；十字为中心`,points(pts,{classes:cls,centers,metric:centers}))}}
 else if(id==='pca'){let pts=[[-2,-2+p],[-1,-1-p],[0,p],[1,1-p],[2,2+p]],mean=[0,p/5],a=pts.map(([x,y])=>[x,y-mean[1]]),xx=sum(a.map(v=>v[0]**2))/5,yy=sum(a.map(v=>v[1]**2))/5,xy=sum(a.map(v=>v[0]*v[1]))/5,t=.5*Math.atan2(2*xy,xx-yy),u=[Math.cos(t),Math.sin(t)];f(`最大方差方向角 ${fmt(t*180/Math.PI)}°；直线经过样本均值`,points(pts,{segments:[[-3*u[0],mean[1]-3*u[1],3*u[0],mean[1]+3*u[1]]],metric:((xx+yy)+Math.hypot(xx-yy,2*xy))/2}))}
 else if(id==='attention'){let t=p*Math.PI/180,q=[Math.cos(t),Math.sin(t)],ks=[[1,0],[0,1],[-1,0]],scores=ks.map(k=>(k[0]*q[0]+k[1]*q[1])/Math.sqrt(2)),weights=soft(scores),vs=[2,5,-1];f(`Q=(${fmt(q[0])},${fmt(q[1])})；计算 QKᵀ/√2`,{...bars(scores,['K0','K1','K2'])});f(`Softmax 后加权 V=[2,5,−1]，输出 ${fmt(sum(weights.map((w,i)=>w*vs[i])))}`,{...bars(weights,['K0','K1','K2']),metric:sum(weights.map((w,i)=>w*vs[i]))})}
 else if(id==='bplus'){let leaves=[[1,3,5],[7,9,11],[13,15,17]],i=p<7?0:p<13?1:2,g={nodes:[{id:0,label:'7 | 13'},...leaves.map((v,j)=>({id:j+1,label:v.join(' | ')}))],edges:leaves.map((_,j)=>({a:0,b:j+1,label:j===0?'<7':j===1?'[7,13)':'≥13'}))};f(`比较分隔键，进入第 ${i+1} 个叶子`,{graph:{...g,active:[i+1]}});f(leaves[i].includes(p)?`叶子内找到 ${p}`:`叶子内没有 ${p}，查找失败`,{graph:{...g,active:[i+1]},metric:leaves[i].includes(p)})}
 else if(id==='hash'){let slots=Array(p).fill(null);for(let key of [10,18,26,5,13]){let i=key%p;while(slots[i]!==null){f(`键 ${key} 在槽 ${i} 冲突，向后探测`,{cells:slots.map(v=>v??'空'),active:[i]});i=(i+1)%p}slots[i]=key;f(`键 ${key} 放入槽 ${i}`,{cells:slots.map(v=>v??'空'),active:[i],metric:slots})}}
 else if(id==='bst'){let nodes=[],edges=[],root=null;for(let key of [7,3,11,1,5,9,13,p]){let cur=root,parent=null,side='';while(cur){parent=cur;if(key===cur.key)break;side=key<cur.key?'left':'right';cur=cur[side]}if(cur){f(`键 ${key} 已存在，不插入`,{graph:{nodes,edges,active:[cur.id]}});continue}let n={key,id:nodes.length};if(parent){parent[side]=n;edges.push({a:parent.id,b:n.id,label:side==='left'?'<':'>'})}else root=n;nodes.push({id:n.id,label:String(key)});f(`插入 ${key}，保持左小右大`,{graph:{nodes,edges,active:[n.id]},metric:nodes.length})}}

};
