[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnflow-core"
version = "0.2.0"
description = "Shared LearnFlow evidence, memory and deterministic teaching implementation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"learnflow_core.visuals" = ["schema*.json", "library/*.json"]
